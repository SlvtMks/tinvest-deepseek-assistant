# Настройки Streamlit-сервиса.
# enableCORS/enableXsrfProtection выключены, потому что приложение работает
# за reverse-proxy Railway (и в любом другом прокси/PaaS).

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "light"
primaryColor = "#FFDD2D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"
textColor = "#1F2933"
font = "sans serif"
