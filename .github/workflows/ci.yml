
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Обновление pip
        run: python -m pip install --upgrade pip

      - name: Установка инструментов тестирования
        run: python -m pip install pytest ruff

      - name: Установка зависимостей проекта
        # Если SDK Т-Инвестиций недоступен, используем минимальный набор.
        run: |
          python -m pip install -r requirements.txt || \
          python -m pip install rich python-dotenv streamlit openai

      - name: Тесты
        run: python -m pytest -q

      - name: Линтер
        run: python -m ruff check .
